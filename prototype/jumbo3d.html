  #help{left:14px;width:min(430px,44vw)} #help ol{margin:6px 0 0;padding-left:22px} #help h3,#status h3{margin:0 0 4px;font-size:15px;color:#f2c200}
  #status{right:14px;width:300px} #status table{border-collapse:collapse;width:100%} #status td{padding:1px 4px} #status td:last-child{text-align:right;font-family:Consolas,monospace}
  .on{color:#5dffa0}.off{color:#8794a3}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<body>
<canvas id="c"></canvas>
<div id="gauge" class="hud box">
  <div class="big" id="gP">1.0E+3 mbar</div>
  <div class="row"><span>Rotary-Leitung</span><b id="gL"></b></div>
  <div class="row"><span>Zeit</span><b id="gT"></b></div>
  <div class="row"><span>Zeitraffer</span><b id="gS">×1</b></div>
</div>
<div id="keys" class="hud box">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> gehen · <kbd>Shift</kbd> laufen<br>
  <kbd>←</kbd><kbd>→</kbd> drehen · <kbd>↑</kbd><kbd>↓</kbd> hoch/runter sehen<br>
  <kbd>E</kbd> / <kbd>Enter</kbd> bedienen<br>
  <kbd>M</kbd> Maus an/aus: <b id="kMode"></b><br>

<script>
  window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+=(e.message||e)+' @'+(e.lineno||'')+'\n';});
  setTimeout(()=>{if(!window.__loaded){const d=document.getElementById('err');d.style.display='block';d.textContent+='Three.js konnte nicht geladen werden – für diesen Prototyp ist eine Internetverbindung nötig (CDN).\n';}},8000);
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

/* =====================================================================
   1) SIMULATION  (Logik aus dem RPG-Maker-Original, Druck als kontinuierliches Modell)
   ===================================================================== */
const BR = [ // Turbopumpen-Zweige
  {id:'alt', name:'alte Turbo',  turbo:'tAlt', fore:'fAlt',  water:['altV','altR'],   wflag:'wAlt'},
  {id:'hp1', name:'HiPace 1',    turbo:'tHp1', fore:'fHp1',  water:['hp1V','hp1R'],   wflag:'wHp'},
  {id:'hp2', name:'HiPace 2',    turbo:'tHp2', fore:'fHp2',  water:['hp2V','hp2R'],   wflag:'wHp'},
  {id:'d1',  name:'Tür-Turbo 1', turbo:'tD1',  fore:'screw', water:['doorV','doorR'], wflag:'wDoor'},
  {id:'d2',  name:'Tür-Turbo 2', turbo:'tD2',  fore:'screw', water:['doorV','doorR'], wflag:'wDoor'},
];
const PEN = { // Fehler -> [Punktabzug, Text]
  notLooked:[300,'Und vielleicht das Wichtigste: Du hast nicht nachgeschaut, ob der Tank leer ist. Immerhin ist nichts Schlimmeres passiert.'],
  v1Fore:[80,'Du hast V1 gegen Unterdruck geschaltet, während die Vorpumpen noch liefen.'],
  v1Under:[40,'Du hast V1 gegen Unterdruck geschaltet.'],
  v1Over:[20,'Du hast V1 gegen Überdruck geschaltet.'],
  rootsEarly:[30,'Du hast die Roots zu früh gestartet.'],
  turboEarly:[30,'Du hast die Turbos zu früh gestartet.'],
  kryoEarly:[30,'Du hast die Kryos zu früh gestartet.'],
  umweg:[10,'Das Umwegventil der Rotary hättest du beim Abpumpen schon öffnen können.'],
  wKryo:[30,'Kein Wasser für die Kryos.'],
  wAlt:[10,'Kein Wasser für die alte Turbo.'],
  wHp:[20,'Kein Wasser für die HiPace-Turbos.'],
  wDoor:[10,'Kein Wasser für die Turbos an der Tür.'],
  wScrew:[25,'Kein Wasser für die Schraubenpumpe.'],
};
const WATER = {altV:'Vorlauf alte Turbo',altR:'Rücklauf alte Turbo',hp1V:'Vorlauf HiPace 1',hp1R:'Rücklauf HiPace 1',hp2V:'Vorlauf HiPace 2',hp2R:'Rücklauf HiPace 2',
  doorV:'Vorlauf Tür-Turbos',doorR:'Rücklauf Tür-Turbos',screwV:'Vorlauf Schraubenpumpe',screwR:'Rücklauf Schraubenpumpe',kryoV:'Vorlauf Kryopumpen',kryoR:'Rücklauf Kryopumpen'};
const VALVE = {V1:'Ventil V1',Vu:'Umwegventil Vu',vent:'Belüftungsventil Rotary-Leitung',alt:'Ventil alte Turbo',hp1:'Ventil HiPace 1',hp2:'Ventil HiPace 2',
  d1:'Ventil Tür-Turbo 1',d2:'Ventil Tür-Turbo 2',zvAtm:'Belüftungsventil Zwischenvakuum',zvPump:'Ventil zur Zwischenvakuumpumpe'};
const PUMP = {rotary:'Rotary',roots:'Roots',kryo:'Kryopumpen',tAlt:'alte Turbo',tHp1:'Turbo HiPace 1',tHp2:'Turbo HiPace 2',tD1:'Tür-Turbo 1',tD2:'Tür-Turbo 2',
  fAlt:'Vorpumpe alte Turbo',fHp1:'Vorpumpe HiPace 1',fHp2:'Vorpumpe HiPace 2',screw:'Schraubenpumpe',zv:'Zwischenvakuumpumpe'};
const zero = o => Object.fromEntries(Object.keys(o).map(k=>[k,0]));
const fresh = () => ({door:0, hand:[0,0], dokGone:false, reached:false, over:false, v:zero(VALVE), w:zero(WATER), on:zero(PUMP),
  p:1000, pL:0.1, t:0, flags:{}, hist:[]});
let S = fresh();
const LN10 = Math.LN10;
const oc = x => x ? 'schließen' : 'öffnen', io = x => x ? 'ausschalten' : 'einschalten';
const flag = k => { S.flags[k] = 1; };
const nTurbo = () => BR.filter(b => S.v[b.id] && S.on[b.turbo]).length;
const zvOK = () => S.v.zvPump && !S.v.zvAtm && S.on.zv;

// dt in simulierten Minuten. Jeder Pumpweg zieht mit Rate k (Dekaden/min) auf seinen Enddruck f.
function step(dt){
  if (S.over) return;
  S.t += dt;
  if (!S.door) S.p = 1000;
  else {
    const zf = zvOK() ? 1 : 10;               // ohne Zwischenvakuum an der Türdichtung: Enddruck 10x schlechter
    let K = 0, KF = 0; const add = (k,f) => { K += k; KF += k*f; };
    if (S.v.V1) {
      if (S.v.vent) add(3, 1000);
      else if (S.on.rotary) { const r = S.on.roots && !S.v.Vu; add(r ? 0.40 : (S.v.Vu ? 0.12 : 0.04), (r ? 1e-2 : 0.5)*zf); }
    }
    for (const b of BR) {
      if (!S.v[b.id]) continue;
      const fl = 5e-2*zf;
      if (S.on[b.fore] && S.on[b.turbo] && S.p < 5) { if (S.p > 2e-6*zf) add(0.05, 2e-6*zf); }
      else if (S.on[b.fore]) add(0.02, fl);        // nur Vorpumpe: grob mitpumpen bzw. Rückströmung
      else if (S.p < fl) add(0.005, fl);           // offenes Ventil an stehendem Zweig
    }
    if (S.on.kryo && S.p > 8e-8*zf) add(0.15, 8e-8*zf);
    if (K > 0) { const F = KF/K; S.p = F + (S.p - F)*Math.exp(-K*LN10*dt); }
    if (S.hand[0] + S.hand[1] < 2 && S.p >= 900) S.p = 1000;   // ohne angezogene Handräder dichtet die Tür nicht an
  }
  if (S.v.V1) S.pL = S.p;
  else if (S.v.vent) S.pL = 1000;
  else if (S.on.rotary && S.pL > 1e-2) S.pL = 1e-2 + (S.pL - 1e-2)*Math.exp(-0.8*LN10*dt);

  if (S.door && S.v.V1 && S.v.vent && S.p < 900) { sfx('bang'); return gameOver('Ein lauter Knall lässt dich zusammenfahren. Deine Ohren bluten regelrecht unter der Kakophonie der sterbenden Pumpen.'); }
  if (S.door && !S.dokGone && S.p < 990) return gameOver('Das Klopfen im Tank ignorierend pumpst du die Kammer ab. Als die Pumpe anzieht, hörst du einen erstickten Schrei. In deiner Panik schaffst du es nicht, die Kammer rechtzeitig zu belüften. Als du die Tür endlich öffnest, blicken dich die toten Augen eines Doktoranden anklagend an …');
  if (S.p <= 1e-7 && !S.reached) { S.reached = true; msg('Udo: „Der Druck ist unten, du hast es geschafft." – Sprich unten am Steuerpult mit Udo, wenn du an alles gedacht hast.'); }
  if (!S.hist.length || S.t - S.hist[S.hist.length-1][0] >= 0.2) { S.hist.push([S.t, S.p]); if (S.hist.length > 4000) S.hist = S.hist.filter((_,i)=>i%2===0); }
}

/* ---- Aktionen (jede bedienbare Stelle in der Halle) ---- */
const ACT = {};
const def = (id,label,fn) => { ACT[id] = {label, do:fn}; };
for (const k of ['Vu','zvAtm','zvPump']) def(k, () => `${VALVE[k]} ${oc(S.v[k])}`, () => { S.v[k] ^= 1; });
for (const b of BR) def('v_'+b.id, () => `${VALVE[b.id]} ${oc(S.v[b.id])}`, () => { S.v[b.id] ^= 1; });
for (const k in WATER) def('w_'+k, () => `${WATER[k]} ${oc(S.w[k])}`, () => { S.w[k] ^= 1; });
for (const k of ['fAlt','fHp1','fHp2','zv']) def(k, () => `${PUMP[k]} ${io(S.on[k])}`, () => { S.on[k] ^= 1; });
for (const b of BR) def('t_'+b.id, () => `${PUMP[b.turbo]} ${io(S.on[b.turbo])}`, () => {
  if (S.on[b.turbo]) { S.on[b.turbo] = 0; return; }
  if (b.fore === 'screw' && !S.on.screw) return msg('Die Steuerung der Turbo ist aus.');
  if (!S.w[b.water[0]] || !S.w[b.water[1]]) { flag(b.wflag); return msg('Die Pumpe geht nicht an.'); }
  S.on[b.turbo] = 1; msg(`Die ${b.name} läuft hoch.`);
  if (S.p > 1) flag('turboEarly');
});
def('V1', () => `${VALVE.V1} ${oc(S.v.V1)}`, () => {
  if (S.v.V1) { S.v.V1 = 0; return msg('Ein lautes Pfeifen ertönt – V1 fährt zu.'); }
  const p = S.p, pl = S.pL; S.v.V1 = 1;
  if (pl < p/3) {                       // evakuierte Leitung gegen vollen Tank
    sfx('bang'); shake(0.5); msg('Ein lauter Knall lässt dich zusammenfahren.');
    if (S.on.rotary || S.on.roots) { flag('v1Fore'); msg('Die Vorpumpen heulen kurz auf, um sich bei dir zu beschweren.'); } else flag('v1Under');
  } else if (pl > p*3) {                // belüftete Leitung gegen evakuierten Tank
    sfx('bang'); shake(0.5);
    if (nTurbo() > 0) return gameOver('Ein lauter Knall lässt dich zusammenfahren. Deine Ohren bluten regelrecht unter der Kakophonie der sterbenden Pumpen.');
    msg('Ein sehr lautes Zischen lässt dich zusammenzucken.'); flag('v1Over'); S.p = Math.min(1000, S.p + pl*0.01);
  } else msg('Ein lautes Pfeifen ertönt – V1 fährt auf.');
});
def('vent', () => `${VALVE.vent} ${oc(S.v.vent)}`, () => {
  S.v.vent ^= 1;
  if (S.v.vent) { sfx('hiss'); if (!S.v.V1) { S.pL = 1000; msg('Zischend strömt Luft in die Leitung zur Rotary.'); } }
});
def('rotary', () => `Rotary ${io(S.on.rotary)}`, () => {
  S.on.rotary ^= 1;
  if (S.on.rotary) { msg('Mit leisem Brummen setzt sich die Pumpe in Bewegung.'); if (!S.v.Vu) flag('umweg'); }
});
def('roots', () => `Roots ${io(S.on.roots)}`, () => {
  if (S.on.roots) { S.on.roots = 0; return; }
  if (!S.on.rotary) return msg('Ohne laufende Rotary lässt sich die Roots nicht starten.');
  if ((S.v.V1 ? S.p : S.pL) > 30) {
    shake(2.5); sfx('rumble'); flag('rootsEarly');
    return msg('Mit lautem Grollen protestiert die Rootspumpe. Der Boden vibriert … nach einem gefühlt ewigen Moment schaltet sich die Pumpe wieder ab.');
  }
  S.on.roots = 1; msg('Die Roots läuft an.');
});
def('kryo', () => `Kryopumpen ${io(S.on.kryo)}`, () => {
  if (S.on.kryo) { S.on.kryo = 0; return msg('Das markante Geräusch der Kryopumpen verklingt und du kannst dich wieder selbst denken hören.'); }
  msg('Mit einem unangenehmen 2-Hz-Pochen laufen die Kryopumpen an.');
  if (!S.w.kryoV || !S.w.kryoR) { flag('wKryo'); return msg('Nach kurzer Zeit verklingt das Geräusch der Kryopumpen wieder.'); }
  S.on.kryo = 1; if (S.p > 1e-5) flag('kryoEarly');
});
def('screw', () => `Schraubenpumpe ${io(S.on.screw)}`, () => {
  if (S.on.screw) { S.on.screw = 0; S.on.tD1 = S.on.tD2 = 0; return; }
  if (!S.w.screwV || !S.w.screwR) { flag('wScrew'); return msg('Die Pumpe läuft kurz an und geht dann wieder aus.'); }
  S.on.screw = 1; msg('Die Schraubenpumpe läuft.');
});
for (const i of [0,1]) def('hand'+i, () => `Handrad ${i ? 'unten' : 'oben'} ${oc(S.hand[i])}`, () => {
  if (!S.hand[i] && !S.door) return msg('Du versuchst die Handräder zu schließen, um die Tür zu verriegeln … Dir fällt auf, dass die Tür noch offen ist. Beschämt trittst du zurück.');
  S.hand[i] ^= 1;
});
def('door', () => `Jumbo-Tür ${S.door ? 'auffahren' : 'zufahren'}`, () => {
  if (!S.door) { S.door = 1; if (!S.dokGone) flag('notLooked'); return msg('Die Tür fährt zu.'); }
  if (S.p < 990) return msg('Der Motor signalisiert mit einem lauten Geräusch seinen Unmut darüber, dass er gegen das Vakuum arbeiten muss. Nichts geschieht …');
  if (S.hand[0] + S.hand[1] > 0) return msg('Der Motor signalisiert mit einem lauten Geräusch seinen Unmut darüber, dass er gegen die geschlossenen Handräder arbeiten muss. Nichts geschieht …');
  S.door = 0; msg('Die Tür fährt auf.');
});
def('dok', () => 'In den Tank schauen', () => {
  if (S.door || S.dokGone) return;
  msg('Im Tank ist ein Triebwerk mit Neutralisator eingebaut. Daneben steht ein Doktorand und misst etwas ab.');
  msg('Du: „Der Tank wird jetzt geschlossen." – Doktorand: „Ok, bin schon weg."');
  S.dokGone = true;
});
def('udo', () => 'Mit Udo sprechen: Abpumpen abschließen', () => finish());
def('help', () => 'Anleitung lesen', () => togglePanel('help', true));

function score(){
  const rows = [[`Benötigte Zeit (${fmtT(S.t)})`, Math.floor(S.t/2)]];
  if (S.hand[0] + S.hand[1] > 0) rows.push(['Du hast vergessen, die Handräder wieder zu öffnen.', 5]);
  if (S.on.rotary) rows.push(['Du hast vergessen, die Rotary auszuschalten.', 15]);
  if (S.on.roots) rows.push(['Du hast vergessen, die Roots auszuschalten.', 15]);
  if (S.pL < 100) rows.push(['Du hast vergessen, die Leitung der Rotary zu belüften. Jetzt steigt Öl aus den Pumpen auf.', 10]);
  for (const k in PEN) if (S.flags[k]) rows.push([PEN[k][1], PEN[k][0]]);
  return {rows, total: 1000 - rows.reduce((a,r)=>a+r[1],0)};
}
const fmtP = p => p.toExponential(1).replace('e','E');
const fmtT = t => { const m = Math.floor(t); return (m >= 60 ? Math.floor(m/60)+' h ' : '') + (m%60) + ' min'; };

/* =====================================================================
   2) UI-HELFER
   ===================================================================== */
const LOG = [];
function msg(text){
  LOG.push(text);
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = text; $('toasts').appendChild(d);
  while ($('toasts').children.length > 4) $('toasts').firstChild.remove();
  setTimeout(() => d.remove(), 5000 + text.length*45);
}
let started = false, paused = true, ended = false, noLock = false, speed = 1, shakeT = 0;
const shake = s => { shakeT = Math.max(shakeT, s); };
function overlay(html, btn, onBtn){
  $('card').innerHTML = html + (btn ? `<br><button id="obtn">${btn}</button>` : '');
  $('overlay').style.display = 'flex';
  if (btn) $('obtn').onclick = onBtn;
}
const hideOverlay = () => { $('overlay').style.display = 'none'; };
function gameOver(text){
  S.over = true; ended = true; if (document.exitPointerLock) document.exitPointerLock();
  overlay(`<h2>Game Over</h2><p>${text}</p>`, 'Neu starten', () => location.reload());
}
function finish(){
  ended = true; if (document.exitPointerLock) document.exitPointerLock();
  const r = score();
  overlay(`<h2>Der Tank wurde erfolgreich auf 1E-7 mbar evakuiert.</h2><table>${r.rows.map(x=>`<tr><td>${x[0]}</td><td>−${x[1]}</td></tr>`).join('')}</table>
    <h1 style="margin-top:14px">${r.total} / 1000 Punkten</h1>`, 'Noch einmal', () => location.reload());
}
function togglePanel(id, force){ const e = $(id); e.style.display = (force || e.style.display !== 'block') ? 'block' : 'none'; }
$('help').innerHTML = `<h3>Abpumpvorgang Jumbo <span class="off">(H schließt)</span></h3><ol>
<li>Kammer überprüfen, um Verluste in der Belegschaft zu minimieren</li>
<li>Kammer schließen (Türschalter), Handräder schließen und anziehen</li>
<li>Rohrleitung zur Rotary belüften (Belüftungsventil danach wieder schließen)</li>
<li>Ventil „V1" öffnen</li><li>Umwegventil „Vu" öffnen</li><li>Rotary starten</li>
<li>Vorpumpe Zwischenvakuum starten und Ventil darüber öffnen</li>
<li>Wasser für Schraubenpumpe öffnen (Vor- und Rücklauf) und Schraubenpumpe starten</li>
<li>Ventile an den Turbos an der Tür öffnen</li>
<li>Handräder wieder öffnen (sobald der Unterdruck die Tür hält)</li>
<li>Warten bis ca. 500 mbar</li>
<li>Ventile und Vorpumpen der Turbopumpen starten (3 Stück)</li>
<li>Warten bis ca. 30 mbar</li>
<li>Umwegventil „Vu" schließen, Roots starten</li>
<li>Wasserkühlung für Turbopumpen öffnen (Vor- und Rücklauf: HiPace 1 und 2, Tür-Turbos, alte Turbo)</li>
<li>Warten bis Kammerdruck ≤ 1 mbar</li>
<li>Turbopumpen starten</li>
<li>Warten bis ca. 3E-2 mbar</li>

let AC = null, humG, whG, kG;
function initAudio(){
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const mk = (type,f,lp) => { const o = AC.createOscillator(); o.type = type; o.frequency.value = f; const g = AC.createGain(); g.gain.value = 0;
      if (lp) { const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl).connect(g); } else o.connect(g);
      g.connect(AC.destination); o.start(); return g; };
    humG = mk('sawtooth', 49, 180); whG = mk('sine', 1180); kG = mk('sine', 62);
  } catch(e) { AC = null; }
}
function sfx(kind){
  if (!AC) return;
  const P = {bang:[0.6,0.9,'lowpass',500], hiss:[0.9,0.12,'highpass',3500], click:[0.04,0.25,'highpass',1500], knock:[0.07,0.6,'lowpass',260], rumble:[2.5,0.7,'lowpass',90]}[kind];
  const n = Math.floor(AC.sampleRate*P[0]), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, kind === 'rumble' ? 0.5 : 2);
  const s = AC.createBufferSource(); s.buffer = buf; const f = AC.createBiquadFilter(); f.type = P[2]; f.frequency.value = P[3];
  const g = AC.createGain(); g.gain.value = P[1]; s.connect(f).connect(g).connect(AC.destination); s.start();
}
function audioUpdate(){
  if (!AC) return;
  const t = AC.currentTime, live = !paused && !ended;
  const nf = S.on.rotary + 2*S.on.roots + S.on.fAlt + S.on.fHp1 + S.on.fHp2 + S.on.screw + S.on.zv*0.5;
  const nt = BR.filter(b => S.on[b.turbo]).length;
  humG.gain.setTargetAtTime(live ? Math.min(0.14, 0.03*nf) : 0, t, 0.3);
  whG.gain.setTargetAtTime(live ? Math.min(0.03, 0.007*nt) : 0, t, 1.2);
  kG.gain.setTargetAtTime(live && S.on.kryo && (t*2 % 1) < 0.22 ? 0.25 : 0, t, 0.02);
}

/* ---- Selbsttest (?test=1) und Kamerapositionen für Screenshots (?cam=x,y,z,yaw,pitch&do=a,b&ff=min) ---- */
function runTest(){
  const out = {}, a = (...ids) => ids.forEach(id => ACT[id].do());
  const wait = c => { let n = 0; while (!c() && n++ < 200000 && !S.over) step(0.01); return +S.t.toFixed(1); };
  a('dok','door','hand0','hand1','vent','vent','V1','Vu','rotary','zv','zvPump','w_screwV','w_screwR','screw','v_d1','v_d2');
  out.t800 = wait(() => S.p < 800); a('hand0','hand1');
  out.t500 = wait(() => S.p < 500); a('v_alt','v_hp1','v_hp2','fAlt','fHp1','fHp2');
  out.t30 = wait(() => S.p < 30); a('Vu','roots','w_altV','w_altR','w_hp1V','w_hp1R','w_hp2V','w_hp2R','w_doorV','w_doorR');
  out.rootsOn = S.on.roots;
  out.t1 = wait(() => S.p <= 1); a('t_alt','t_hp1','t_hp2','t_d1','t_d2'); out.turbos = nTurbo();
  out.t3e2 = wait(() => S.p <= 3e-2); a('V1','roots','rotary','vent');
  out.t1e5 = wait(() => S.p <= 1e-5); a('w_kryoV','w_kryoR','kryo');
  out.tEnd = wait(() => S.reached); out.pEnd = S.p; out.flags = Object.keys(S.flags); out.score = score().total; out.over = S.over;
  // Gegenproben
  S = fresh(); a('dok','door','V1'); out.negV1 = Object.keys(S.flags);
  S = fresh(); a('door','hand0','hand1','vent','vent','V1','Vu','rotary'); wait(() => S.p < 500); out.negDok = S.over;
  S = fresh(); a('dok','door','hand0','hand1','vent','vent','V1','Vu','rotary','roots'); out.negRoots = Object.keys(S.flags);
  S = fresh(); a('dok','door','hand0','hand1','vent','vent','V1','Vu','rotary'); wait(() => S.t > 200); out.rotaryOnlyFloor = S.p;
  $('testout').style.display = 'block'; $('testout').textContent = 'TESTRESULT ' + JSON.stringify(out); document.title = 'TEST ' + JSON.stringify(out);
}
window.__loaded = true; window.__jumbo = {get S(){return S;}, ACT, step, score};
if (Q.get('test')) { try { runTest(); } catch(e) { $('testout').style.display = 'block'; $('testout').textContent = 'TESTERROR ' + e.stack; } }
if (Q.get('cam')) {
  const c = Q.get('cam').split(',').map(Number); P.x = c[0]; P.feet = c[1]-1.7; P.z = c[2]; P.yaw = (c[3]||0)*Math.PI/180; P.pitch = (c[4]||0)*Math.PI/180;
  S = fresh(); hideOverlay(); started = true; paused = true; ended = false;
  (Q.get('do') || '').split(',').filter(Boolean).forEach(id => ACT[id].do());
  for (let i = 0, n = (+Q.get('ff')||0)*100; i < n; i++) step(0.01);
  if (S.door) doorAnim = 0;
}
requestAnimationFrame(frame);
